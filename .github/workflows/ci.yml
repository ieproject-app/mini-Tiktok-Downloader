name: CI - Test Import & Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        run: |
          python -m py_compile _engine/src/paths.py
          python -m py_compile _engine/src/config_manager.py
          python -m py_compile _engine/src/downloader.py
          python -m py_compile _engine/src/preflight.py
          python -m py_compile _engine/src/updater.py
          python -m py_compile _engine/src/app.py
          echo "All syntax checks passed!"

      - name: Test imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '_engine/src')
          import paths
          import config_manager
          import downloader
          import updater
          print('All imports successful!')
          print('TikTok hosts:', downloader.TIKTOK_HOSTS)
          print('Formats:', [f[0] for f in downloader.ALL_FORMATS])
          "

      - name: Test URL detection
        run: |
          python -c "
          import sys
          sys.path.insert(0, '_engine/src')
          from downloader import is_supported_tiktok_url, normalize_tiktok_url

          assert is_supported_tiktok_url('https://www.tiktok.com/@user/video/123'), 'Long URL should be supported'
          assert is_supported_tiktok_url('https://vm.tiktok.com/XXXX/'), 'Short URL should be supported'
          assert is_supported_tiktok_url('https://vt.tiktok.com/XXXX/'), 'Short vt URL should be supported'
          assert not is_supported_tiktok_url('https://youtube.com/watch?v=abc'), 'YouTube URL should not be supported'
          assert not is_supported_tiktok_url('https://google.com'), 'Google URL should not be supported'
          assert normalize_tiktok_url('vm.tiktok.com/XXXX/') == 'https://vm.tiktok.com/XXXX/', 'Should add https://'
          print('All URL detection tests passed!')
          "
